---
common:
  service_url: https://facade-main-6f3kfepqcq-ew.a.run.app/v1/provision

".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true

spec/default_facts.yml:
  extra_facts:
    networking:
      fqdn: "foo.example.com"
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: false
  # acceptance flags set by hand (Puppet 9 platform excludes) (MODULES-11997 pdk update)
  acceptance_flags:
  - "--nightly"
  - "--collection-platform-exclude 9:redhat-7"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:oraclelinux-7"
  - "--collection-platform-exclude 9:scientific-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
  - "--collection-platform-exclude 9:windows-2012r2-x86"
.github/workflows/nightly.yml:
  unmanaged: false
  cron: '5 4 * * *'
  # acceptance flags set by hand (Puppet 9 platform excludes) (MODULES-11997 pdk update)
  acceptance_flags:
  - "--nightly"
  - "--collection-platform-exclude 9:redhat-7"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:oraclelinux-7"
  - "--collection-platform-exclude 9:scientific-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
  - "--collection-platform-exclude 9:windows-2012r2-x86"
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
Rakefile:
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - strict_indent
