name: OracleLinux 8 SSH Timing Test

on:
  workflow_dispatch:  # allows manual triggering
  push:
    branches:
      - debug/oraclelinux8-ssh-timing

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    name: Test SSH on litmusimage/oraclelinux:8

    steps:
      - name: Disable Apparmor
        run: |
          if command -v apparmor_parser >/dev/null ; then
            sudo find /etc/apparmor.d/ -maxdepth 1 -type f -exec ln -sf {} /etc/apparmor.d/disable/ \;
            sudo apparmor_parser -R /etc/apparmor.d/disable/* || true
            sudo systemctl disable apparmor
            sudo systemctl stop apparmor
          fi

      - name: Pull litmusimage/oraclelinux:8 image
        run: docker pull litmusimage/oraclelinux:8

      - name: Start container with port forwarding
        run: |
          docker run -d --name ol8-test \
            -p 2222:22 \
            --privileged \
            --tmpfs /tmp:exec \
            litmusimage/oraclelinux:8 /lib/systemd/systemd

      - name: Wait for systemd to report running/degraded
        run: |
          docker exec ol8-test bash -c '
            if [[ "$(readlink /proc/1/exe)" == "/usr/lib/systemd/systemd" ]]; then
              count=0
              while ! [[ "$(systemctl is-system-running)" =~ ^running|degraded$ && $count > 20 ]]; do
                sleep 0.1
                count=$((count+1))
              done
            fi
            echo "status=$(systemctl is-system-running)"
          '

      - name: Confirm host keys already present (should be baked in)
        run: docker exec ol8-test ls -la /etc/ssh/

      - name: dnf install sudo openssh-server openssh-clients
        run: docker exec ol8-test dnf install -y sudo openssh-server openssh-clients

      - name: Set root password
        run: docker exec ol8-test bash -c "echo root:root | /usr/sbin/chpasswd"

      - name: Configure sshd_config
        run: |
          docker exec ol8-test sed -ri 's/^#?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          docker exec ol8-test sed -ri 's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          docker exec ol8-test sed -ri 's/^#?UseDNS .*/UseDNS no/' /etc/ssh/sshd_config

      - name: Start sshd
        run: docker exec ol8-test /usr/sbin/sshd

      - name: Wait a moment for sshd to be ready
        run: sleep 3

      - name: Try SSH login
        run: |
          sudo apt-get install -y sshpass
          sshpass -p root ssh -v -o StrictHostKeyChecking=no -p 2222 root@localhost "echo SSH success; uname -a"

      - name: Dump container logs and auth logs on failure
        if: failure()
        run: |
          echo "::group::docker logs"
          docker logs ol8-test
          echo "::endgroup::"
          echo "::group::/var/log/secure (auth log)"
          docker exec ol8-test cat /var/log/secure || true
          echo "::endgroup::"
          echo "::group::sshd -T (effective config)"
          docker exec ol8-test /usr/sbin/sshd -T || true
          echo "::endgroup::"
          echo "::group::getenforce / apparmor status on host"
          getenforce 2>&1 || true
          sudo aa-status 2>&1 || true
          echo "::endgroup::"

  real-litmus-provision-with-apparmor:
    runs-on: ubuntu-latest
    name: Real litmus:provision, AppArmor ON (default)
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Provision environment (real litmus:provision task)
        run: bundle exec rake "litmus:provision[docker,litmusimage/oraclelinux:8,]"

      - name: Tear down
        if: always()
        run: bundle exec rake 'litmus:tear_down' || true

  real-litmus-provision-without-apparmor:
    runs-on: ubuntu-latest
    name: Real litmus:provision, AppArmor OFF
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Apparmor
        run: |
          if command -v apparmor_parser >/dev/null ; then
            sudo find /etc/apparmor.d/ -maxdepth 1 -type f -exec ln -sf {} /etc/apparmor.d/disable/ \;
            sudo apparmor_parser -R /etc/apparmor.d/disable/* || true
            sudo systemctl disable apparmor
            sudo systemctl stop apparmor
          fi

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Provision environment (real litmus:provision task)
        run: bundle exec rake "litmus:provision[docker,litmusimage/oraclelinux:8,]"

      - name: Tear down
        if: always()
        run: bundle exec rake 'litmus:tear_down' || true
